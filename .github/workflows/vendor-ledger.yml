# Citation checks follow all their inputs; the larger vendor test matrix remains
# in vendor-patches.yml and does not run for a workspace-only test rename.
name: vendor-ledger

on:
  push:
    branches: [main]
    paths:
      - 'vendor/**'
      - 'apps/pdfcraft/**'
      - 'crates/**'
      - 'xtask/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vendor-ledger.yml'
  pull_request:
    paths:
      - 'vendor/**'
      - 'apps/pdfcraft/**'
      - 'crates/**'
      - 'xtask/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vendor-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: vendor ledger (ledger ↔ sources)
    continue-on-error: true # TODO(ratchet): remove at gate graduation review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vendor-ledger
      - name: Ledger self-tests
        run: cargo test --locked -p xtask vendor_ledger
      - name: Check ledger against sources
        run: cargo run --locked -p xtask -- vendor-ledger
